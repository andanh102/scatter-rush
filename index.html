<!DOCTYPE html>
<html lang="en" class="notranslate" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scatter Rush - Vegas Deluxe Casino</title>
    
    <!-- Firebase Tracking SDK -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT_ID.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
      };

      try {
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.logVisitorToFirestore = async function(actionName, details) {
          await addDoc(collection(db, "user_activities"), {
            timestamp: serverTimestamp(),
            action: actionName,
            details: details,
            userAgent: navigator.userAgent
          });
        };
        logVisitorToFirestore("visit_deluxe_lobby", "Loaded Vegas Deluxe shimmering lobby");
      } catch (e) {
        console.log("Firestore offline mode");
      }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap');

        :root {
            --bg-deep: #060812;
            --gold: #ffd700;
            --gold-glow: 0 0 15px rgba(255, 215, 0, 0.6), inset 0 0 10px rgba(255, 215, 0, 0.4);
            --neon-green: #00ff88;
            --neon-pink: #ff007f;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; user-select: none; }
        body { background: var(--bg-deep); background-image: radial-gradient(circle at 50% 0%, #29104a 0%, #060812 75%); color: #fff; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

        /* HEADER LẤP LÁNH */
        header { background: rgba(10, 12, 24, 0.95); border-bottom: 2px solid var(--gold); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 20px rgba(0,0,0,0.8); }
        .logo { font-size: 22px; font-weight: 900; background: linear-gradient(180deg, #fff 30%, var(--gold) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 8px rgba(255,215,0,0.6)); letter-spacing: 1.5px; }
        
        .header-right { display: flex; align-items: center; gap: 12px; }
        .balance-badge { background: linear-gradient(135deg, #161b2e, #0b0f1a); border: 2px solid var(--gold); box-shadow: var(--gold-glow); padding: 8px 16px; border-radius: 20px; font-weight: 900; color: var(--neon-green); font-size: 14px; }

        /* CONTAINER CHÍNH */
        .container { max-width: 1000px; margin: 0 auto; width: 100%; padding: 20px 15px; flex: 1; }

        /* JACKPOT BANNER LẤP LÁNH */
        .jackpot-banner { background: linear-gradient(135deg, #3c096c, #7b2cbf, #240046); border-radius: 20px; border: 2px solid var(--gold); padding: 22px; text-align: center; box-shadow: 0 0 35px rgba(123, 44, 191, 0.8), inset 0 0 15px rgba(255, 215, 0, 0.5); margin-bottom: 25px; position: relative; animation: pulseGlow 3s infinite alternate; }
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 20px rgba(123, 44, 191, 0.6); }
            100% { box-shadow: 0 0 40px rgba(255, 215, 0, 0.8); }
        }
        .jackpot-title { font-size: 13px; font-weight: 700; color: #e0aaff; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 5px; }
        .jackpot-val { font-size: 38px; font-weight: 900; color: var(--gold); text-shadow: 0 0 15px var(--gold), 0 2px 4px #000; }

        /* SECTION TITLE */
        .section-header { font-size: 16px; font-weight: 900; color: var(--gold); letter-spacing: 1px; margin-bottom: 15px; border-left: 4px solid var(--gold); padding-left: 10px; text-shadow: 0 0 8px rgba(255,215,0,0.4); }

        /* GRID SẢNH GAME - CÂN ĐỐI, GỌN GÀNG */
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; margin-bottom: 30px; }
        .game-card { background: linear-gradient(145deg, #13192f, #0a0e1c); border: 2px solid #232e52; border-radius: 16px; padding: 20px 15px; text-align: center; cursor: pointer; transition: all 0.3s ease; position: relative; overflow: hidden; }
        .game-card:hover { transform: translateY(-6px); border-color: var(--gold); box-shadow: 0 10px 25px rgba(255, 215, 0, 0.3), inset 0 0 10px rgba(255, 215, 0, 0.2); }
        .game-icon { font-size: 50px; margin-bottom: 12px; display: inline-block; filter: drop-shadow(0 5px 8px rgba(0,0,0,0.6)); }
        .game-name { font-size: 15px; font-weight: 900; color: #fff; margin-bottom: 8px; }
        .game-tag { display: inline-block; background: linear-gradient(90deg, #ff0055, #ff5000); color: #fff; font-size: 10px; font-weight: 900; padding: 3px 10px; border-radius: 10px; text-transform: uppercase; letter-spacing: 0.5px; box-shadow: 0 0 8px rgba(255,0,85,0.5); }
        .game-tag.rtp { background: linear-gradient(90deg, #00b09b, #96c93d); box-shadow: 0 0 8px rgba(0,176,155,0.5); }
        .game-tag.mult { background: linear-gradient(90deg, #f7ff00, #db36a4); box-shadow: 0 0 8px rgba(245,87,108,0.5); color: #000; }

        /* MODAL CHƠI GAME */
        #game-modal { display: none; background: rgba(11, 15, 29, 0.98); border: 2px solid var(--gold); border-radius: 20px; padding: 25px; text-align: center; box-shadow: 0 0 50px rgba(0,0,0,0.9), inset 0 0 20px rgba(255,215,0,0.2); margin-bottom: 30px; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        /* NÚT BẤM VÀ HÀNH ĐỘNG */
        .btn-play { background: linear-gradient(180deg, #ff9900 0%, #cc5500 100%); border: 2px solid #fff; color: #fff; padding: 12px 30px; border-radius: 12px; font-size: 15px; font-weight: 900; cursor: pointer; box-shadow: 0 5px 15px rgba(255, 153, 0, 0.5); text-transform: uppercase; transition: 0.2s; }
        .btn-play:hover { transform: scale(1.05); box-shadow: 0 8px 20px rgba(255, 153, 0, 0.8); }
        .btn-back { background: #222a45; border: 1px solid #3d4a7a; color: #bbb; padding: 8px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 15px; }

        .footer-buttons { display: flex; justify-content: center; gap: 15px; margin-top: 20px; }
        .btn-dep { background: linear-gradient(180deg, #00e676 0%, #00994d 100%); border: 2px solid #fff; color: #000; padding: 14px 28px; border-radius: 12px; font-weight: 900; cursor: pointer; box-shadow: 0 4px 15px rgba(0,230,118,0.5); text-transform: uppercase; }
        .btn-wd { background: linear-gradient(180deg, #ff1744 0%, #b2102f 100%); border: 2px solid #fff; color: #fff; padding: 14px 28px; border-radius: 12px; font-weight: 900; cursor: pointer; box-shadow: 0 4px 15px rgba(255,23,68,0.5); text-transform: uppercase; }
    </style>
</head>
<body class="notranslate">

    <header>
        <div class="logo">⚡ SCATTER RUSH</div>
        <div class="header-right">
            <div class="balance-badge">USDT <span id="balVal">319.00</span></div>
        </div>
    </header>

    <div class="container">
        <!-- Progressive Jackpot Banner -->
        <div class="jackpot-banner">
            <div class="jackpot-title">US VEGAS PROGRESSIVE JACKPOT</div>
            <div class="jackpot-val">$<span id="jackpotVal">40,560.25</span></div>
        </div>

        <div class="section-header">POPULAR SWEEPSTAKES & GAMES</div>
        
        <div class="game-grid">
            <div class="game-card" onclick="openGame('slots')">
                <span class="game-icon">🎰</span>
                <div class="game-name">Scatter Rush Slots</div>
                <span class="game-tag rtp">RTP 97.2%</span>
            </div>
            <div class="game-card" onclick="openGame('crash')">
                <span class="game-icon">🚀</span>
                <div class="game-name">Crypto Crash Rocket</div>
                <span class="game-tag mult">X100 MULTIPLIER</span>
            </div>
            <div class="game-card" onclick="openGame('blackjack')">
                <span class="game-icon">🃏</span>
                <div class="game-name">VIP Vegas Blackjack</div>
                <span class="game-tag">LIVE TABLE</span>
            </div>
            <div class="game-card" onclick="openGame('wheel')">
                <span class="game-icon">🎡</span>
                <div class="game-name">Wheel of Fortune</div>
                <span class="game-tag mult">MAX WIN X50</span>
            </div>
        </div>

        <!-- Dynamic Game Modal Area -->
        <div id="game-modal">
            <h2 id="modal-title" style="color: var(--gold); font-size: 20px; font-weight: 900; margin-bottom: 15px;">GAME ARENA</h2>
            <div id="modal-content"></div>
            <button class="btn-back" onclick="closeGame()">BACK TO LOBBY</button>
        </div>

        <div class="footer-buttons">
            <button class="btn-dep" onclick="alert('USDT TRC20 Gateway Opening...')">DEPOSIT USDT</button>
            <button class="btn-wd" onclick="alert('Withdrawal requires minimum 10 USDT.')">WITHDRAW</button>
        </div>
    </div>

    <script>
        let balance = 319.00;

        // Auto Jackpot Counter
        setInterval(() => {
            let el = document.getElementById('jackpotVal');
            let cur = parseFloat(el.innerText.replace(/,/g, ''));
            cur += Math.random() * 1.5;
            el.innerText = cur.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }, 1500);

        function openGame(type) {
            document.getElementById('game-modal').style.display = 'block';
            let content = document.getElementById('modal-content');
            let title = document.getElementById('modal-title');

            if(type === 'slots') {
                title.innerText = "🎰 SCATTER RUSH SLOTS";
                content.innerHTML = `
                    <div style="font-size: 45px; background: #04060c; padding: 20px; border-radius: 14px; border: 1px solid #334165; margin-bottom: 15px;" id="slot-reels">💎 | ⚡ | 👑</div>
                    <p id="slot-msg" style="color: var(--neon-green); font-weight: bold; margin-bottom: 15px;">Match 3 symbols to win big!</p>
                    <button class="btn-play" onclick="playSlots()">SPIN ($1 USDT)</button>
                `;
            } else if(type === 'crash') {
                title.innerText = "🚀 CRYPTO CRASH ROCKET";
                content.innerHTML = `
                    <div style="font-size: 36px; font-weight: 900; color: var(--neon-green); background: #04060c; padding: 25px; border-radius: 14px; border: 1px solid #334165; margin-bottom: 15px;" id="crash-val">1.00x</div>
                    <button class="btn-play" onclick="playCrash()">LAUNCH ROCKET ($2 USDT)</button>
                `;
            } else if(type === 'blackjack') {
                title.innerText = "🃏 VIP VEGAS BLACKJACK";
                content.innerHTML = `
                    <div style="font-size: 28px; margin: 15px 0;">🂡 🂮 vs 🃁 🂫</div>
                    <p style="color: #bbb; margin-bottom: 15px;">Beat the dealer to double your USDT!</p>
                    <button class="btn-play" onclick="playBlackjack()">DEAL CARDS ($5 USDT)</button>
                `;
            } else if(type === 'wheel') {
                title.innerText = "🎡 WHEEL OF FORTUNE";
                content.innerHTML = `
                    <div style="font-size: 50px; margin: 15px 0;">🎯</div>
                    <p id="wheel-msg" style="color: var(--gold); font-weight: bold; margin-bottom: 15px;">Spin to hit multipliers up to x50!</p>
                    <button class="btn-play" onclick="playWheel()">SPIN WHEEL ($1 USDT)</button>
                `;
            }

            if (window.logVisitorToFirestore) {
                window.logVisitorToFirestore("open_game", `Opened game: ${type}`);
            }
        }

        function closeGame() {
            document.getElementById('game-modal').style.display = 'none';
        }

        function playSlots() {
            if(balance < 1) { alert("Low balance!"); return; }
            balance -= 1;
            const syms = ['💎', '⚡', '👑', '7️⃣', '🔔'];
            let r1 = syms[Math.floor(Math.random()*syms.length)];
            let r2 = syms[Math.floor(Math.random()*syms.length)];
            let r3 = syms[Math.floor(Math.random()*syms.length)];
            document.getElementById('slot-reels').innerText = `${r1} | ${r2} | ${r3}`;
            let win = (r1 === r2 && r2 === r3) ? 25 : (r1 === '⚡' || r2 === '⚡' || r3 === '⚡') ? 2 : 0;
            balance += win;
            document.getElementById('balVal').innerText = balance.toFixed(2);
            document.getElementById('slot-msg').innerText = win > 0 ? `🎉 WIN +$${win} USDT!` : "No win, try again!";
        }

        function playCrash() {
            if(balance < 2) { alert("Low balance!"); return; }
            balance -= 2;
            let mult = (Math.random() * 5 + 1).toFixed(2);
            document.getElementById('crash-val').innerText = mult + "x";
            let win = mult > 2.0 ? 5 : 0;
            balance += win;
            document.getElementById('balVal').innerText = balance.toFixed(2);
        }

        function playBlackjack() {
            if(balance < 5) { alert("Low balance!"); return; }
            balance -= 5;
            let win = Math.random() > 0.5 ? 10 : 0;
            balance += win;
            document.getElementById('balVal').innerText = balance.toFixed(2);
            alert(win > 0 ? "🎉 Blackjack! You won $10 USDT" : "Dealer wins!");
        }

        function playWheel() {
            if(balance < 1) { alert("Low balance!"); return; }
            balance -= 1;
            let mults = [0, 2, 5, 10, 50, 0];
            let win = mults[Math.floor(Math.random()*mults.length)];
            balance += win;
            document.getElementById('balVal').innerText = balance.toFixed(2);
            document.getElementById('wheel-msg').innerText = win > 0 ? `🎯 Lucky Hit! Won +$${win} USDT!` : "Aww, missed!";
        }
    </script>
</body>
</html>
