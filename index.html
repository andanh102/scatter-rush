<!DOCTYPE html>
<html lang="en" class="notranslate" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scatter Rush - Cleopatra's Fortune Slot</title>

    <!-- Firebase Tracking SDK -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT_ID.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
      };

      try {
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.logVisitorToFirestore = async function(actionName, details) {
          await addDoc(collection(db, "user_activities"), {
            timestamp: serverTimestamp(),
            action: actionName,
            details: details,
            userAgent: navigator.userAgent
          });
        };
        logVisitorToFirestore("visit_cleopatra_slot", "Loaded Cleopatra 3D Animated Slot Engine");
      } catch (e) {
        console.log("Firestore offline mode");
      }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap');

        :root {
            --gold: #ffd700;
            --gold-glow: 0 0 15px rgba(255, 215, 0, 0.8);
            --purple-bg: radial-gradient(circle at 50% 30%, #3a0d5c 0%, #0c0217 85%);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; user-select: none; }
        body { background: #07020d; background-image: var(--purple-bg); color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: space-between; overflow-x: hidden; padding-bottom: 10px; }

        /* HEADER TOP STRIP */
        header { width: 100%; background: rgba(10, 2, 20, 0.95); border-bottom: 2px solid var(--gold); padding: 8px 15px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.8); }
        .hdr-balance { background: #000; border: 2px solid var(--gold); border-radius: 20px; padding: 4px 12px; font-size: 13px; font-weight: 900; color: #00ffcc; box-shadow: var(--gold-glow); }
        .btn-buy-hdr { background: linear-gradient(180deg, #00e676, #00802b); border: 2px solid #fff; color: #fff; font-size: 12px; font-weight: 900; padding: 4px 12px; border-radius: 6px; cursor: pointer; }

        /* SLOT MACHINE CABINET */
        .slot-container { width: 100%; max-width: 850px; padding: 10px; display: flex; flex-direction: column; align-items: center; }

        /* TITLE & JACKPOT DISPLAY */
        .game-title { font-size: 26px; font-weight: 900; color: var(--gold); text-shadow: 0 0 15px var(--gold), 0 2px 4px #000; text-transform: uppercase; margin-bottom: 8px; text-align: center; }
        
        .jackpot-display-row { display: flex; justify-content: center; gap: 8px; width: 100%; margin-bottom: 12px; flex-wrap: wrap; }
        .jp-box { background: rgba(0, 0, 0, 0.8); border: 2px solid var(--gold); border-radius: 8px; padding: 4px 10px; text-align: center; min-width: 120px; }
        .jp-name { font-size: 10px; font-weight: 900; letter-spacing: 1px; }
        .jp-grand { color: #ff3366; } .jp-major { color: #cc66ff; } .jp-minor { color: #00d2ff; } .jp-mini { color: #00ff88; }
        .jp-val { font-size: 13px; font-weight: 900; color: var(--gold); }

        /* REELS FRAME - LỘNG LẪY KHUNG VÀNG */
        .reels-frame { background: rgba(15, 3, 28, 0.9); border: 4px solid var(--gold); border-radius: 16px; padding: 12px; box-shadow: 0 0 35px rgba(255, 215, 0, 0.5), inset 0 0 15px rgba(255, 215, 0, 0.3); display: flex; justify-content: center; gap: 10px; width: 100%; position: relative; overflow: hidden; }

        /* REEL COLUMN ANIMATION */
        .reel-column { width: 30%; height: 210px; background: #000; border: 2px solid #3d1b63; border-radius: 10px; overflow: hidden; position: relative; }
        .reel-strip { position: absolute; top: 0; left: 0; width: 100%; display: flex; flex-direction: column; transition: top 0.1s ease-out; }
        .reel-symbol { height: 70px; display: flex; align-items: center; justify-content: center; font-size: 40px; border-bottom: 1px solid rgba(255,255,255,0.05); }

        /* WIN BANNER */
        .win-display { margin-top: 10px; height: 35px; font-size: 18px; font-weight: 900; color: #00ff88; text-shadow: 0 0 10px #00ff88; text-align: center; }

        /* CONTROL PANEL BAR */
        .control-panel { width: 100%; max-width: 850px; background: linear-gradient(180deg, #1f0836, #090112); border: 2px solid var(--gold); border-radius: 16px; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; gap: 8px; box-shadow: 0 5px 20px rgba(0,0,0,0.8); }
        .btn-ctrl { background: linear-gradient(180deg, #3a445d, #1e2436); border: 2px solid #888; color: #fff; padding: 10px 14px; border-radius: 10px; font-weight: 900; font-size: 13px; cursor: pointer; box-shadow: 0 3px 6px #000; text-transform: uppercase; }
        .btn-ctrl:active { transform: translateY(2px); }
        
        .bet-box { background: #000; border: 1px solid var(--gold); padding: 6px 12px; border-radius: 8px; text-align: center; }
        .bet-label { font-size: 9px; color: #aaa; }
        .bet-val { font-size: 14px; font-weight: 900; color: var(--gold); }

        /* BIG SPIN BUTTON */
        .btn-spin { background: linear-gradient(180deg, #00e676 0%, #00802b 100%); border: 3px solid #fff; color: #fff; padding: 12px 30px; border-radius: 14px; font-size: 20px; font-weight: 900; cursor: pointer; box-shadow: 0 0 20px rgba(0,230,118,0.8); text-transform: uppercase; letter-spacing: 1px; }
        .btn-spin:disabled { opacity: 0.5; cursor: not-allowed; }

        .footer-nav { display: flex; gap: 10px; margin-top: 10px; }
        .btn-gate { padding: 10px 20px; border-radius: 10px; font-weight: 900; border: none; cursor: pointer; font-size: 13px; }
    </style>
</head>
<body class="notranslate">

    <header>
        <div class="hdr-balance">USDT: <span id="balVal">608,201.00</span></div>
        <button class="btn-buy-hdr" onclick="alert('USDT Gateway Loading...')">BUY USDT</button>
    </header>

    <div class="slot-container">
        <div class="game-title">👑 CLEOPATRA'S FORTUNE</div>

        <!-- 4-TIER VEGAS JACKPOT DISPLAY -->
        <div class="jackpot-display-row">
            <div class="jp-box"><div class="jp-name jp-grand">GRAND</div><div class="jp-val" id="jpGrand">$89,333,630</div></div>
            <div class="jp-box"><div class="jp-name jp-major">MAJOR</div><div class="jp-val" id="jpMajor">$46,214,912</div></div>
            <div class="jp-box"><div class="jp-name jp-minor">MINOR</div><div class="jp-val" id="jpMinor">$612,664</div></div>
            <div class="jp-box"><div class="jp-name jp-mini">MINI</div><div class="jp-val" id="jpMini">$46,199</div></div>
        </div>

        <!-- REELS FRAME -->
        <div class="reels-frame">
            <div class="reel-column"><div class="reel-strip" id="reel1"></div></div>
            <div class="reel-column"><div class="reel-strip" id="reel2"></div></div>
            <div class="reel-column"><div class="reel-strip" id="reel3"></div></div>
        </div>

        <div class="win-display" id="winMsg">PRESS SPIN TO WIN!</div>
    </div>

    <!-- VEGAS CONTROL PANEL -->
    <div class="control-panel">
        <button class="btn-ctrl" onclick="changeBet(-1)">BET -</button>
        <div class="bet-box">
            <div class="bet-label">BET AMOUNT</div>
            <div class="bet-val">$<span id="betAmt">1</span> USDT</div>
        </div>
        <button class="btn-ctrl" onclick="changeBet(1)">BET +</button>
        <button class="btn-ctrl" onclick="setBetMax()">BET MAX</button>
        <button class="btn-spin" id="spinBtn" onclick="spinReels()">SPIN</button>
    </div>

    <div class="footer-nav">
        <button class="btn-gate" style="background: linear-gradient(180deg,#00e676,#00802b); color:#000;" onclick="alert('Deposit USDT')">DEPOSIT</button>
        <button class="btn-gate" style="background: linear-gradient(180deg,#ff1744,#b2102f); color:#fff;" onclick="alert('Withdraw USDT')">WITHDRAW</button>
    </div>

    <script>
        let balance = 608201.00;
        let currentBet = 1;
        let isSpinning = false;

        const symbols = ['👑', '💎', '⚡', '🪲', '🏺', '7️⃣'];

        // TẠO CHUỖI BIỂU TƯỢNG VÀ KHỞI TẠO CUỘN QUAY
        function initReel(id) {
            let el = document.getElementById(id);
            let html = '';
            for(let i=0; i<20; i++) {
                let s = symbols[Math.floor(Math.random()*symbols.length)];
                html += `<div class="reel-symbol">${s}</div>`;
            }
            el.innerHTML = html;
            el.style.top = '0px';
        }

        initReel('reel1');
        initReel('reel2');
        initReel('reel3');

        function changeBet(val) {
            if(isSpinning) return;
            currentBet = Math.max(1, currentBet + val);
            document.getElementById('betAmt').innerText = currentBet;
        }

        function setBetMax() {
            if(isSpinning) return;
            currentBet = 100;
            document.getElementById('betAmt').innerText = currentBet;
        }

        // HOẠT ẢNH QUAY TRUỘT DỌC CỦA CÁC CUỘN SLOTS
        function spinReels() {
            if(isSpinning) return;
            if(balance < currentBet) { alert("Low balance!"); return; }

            balance -= currentBet;
            document.getElementById('balVal').innerText = balance.toLocaleString('en-US', {minimumFractionDigits: 2});
            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;
            document.getElementById('winMsg').innerText = "SPINNING...";

            let reels = ['reel1', 'reel2', 'reel3'];
            let results = [];

            reels.forEach((id, index) => {
                let el = document.getElementById(id);
                initReel(id); // Tạo chuỗi ngẫu nhiên mới
                
                let targetPos = - (Math.floor(Math.random() * 10) + 5) * 70; // Vị trí dừng
                let duration = 1000 + (index * 400); // Tốc độ dừng từng cột theo thứ tự

                setTimeout(() => {
                    el.style.transition = 'top 0.8s cubic-bezier(0.1, 0.9, 0.2, 1)';
                    el.style.top = targetPos + 'px';
                    
                    // Lấy biểu tượng dừng lại ở giữa
                    let stoppedSymbol = el.children[Math.abs(targetPos/70) + 1].innerText;
                    results.push(stoppedSymbol);

                    if(index === 2) {
                        setTimeout(() => checkWin(results), 800);
                    }
                }, index * 200);
            });
        }

        function checkWin(res) {
            isSpinning = false;
            document.getElementById('spinBtn').disabled = false;

            let win = 0;
            if(res[0] === res[1] && res[1] === res[2]) {
                win = currentBet * 50;
            } else if(res[0] === res[1] || res[1] === res[2] || res[0] === res[2]) {
                win = currentBet * 3;
            }

            if(win > 0) {
                balance += win;
                document.getElementById('balVal').innerText = balance.toLocaleString('en-US', {minimumFractionDigits: 2});
                document.getElementById('winMsg').innerText = `🎉 BIG WIN +$${win} USDT!`;
            } else {
                document.getElementById('winMsg').innerText = "TRY AGAIN!";
            }

            if(window.logVisitorToFirestore) {
                window.logVisitorToFirestore("spin_cleopatra", `Bet: $${currentBet}, Win: $${win}`);
            }
        }

        // TĂNG GIÁ TRỊ JACKPOT TỰ ĐỘNG
        setInterval(() => {
            let el = document.getElementById('jpGrand');
            let cur = parseInt(el.innerText.replace(/[\$,]/g, ''));
            cur += Math.floor(Math.random()*15);
            el.innerText = '$' + cur.toLocaleString();
        }, 1200);
    </script>
</body>
</html>
