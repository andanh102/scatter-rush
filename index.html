<!DOCTYPE html>
<html lang="en" class="notranslate" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scatter Rush - Vegas Deluxe Slot</title>

    <!-- Firebase Tracking SDK -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT_ID.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
      };

      try {
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.logVisitorToFirestore = async function(actionName, details) {
          await addDoc(collection(db, "user_activities"), {
            timestamp: serverTimestamp(),
            action: actionName,
            details: details,
            userAgent: navigator.userAgent
          });
        };
        logVisitorToFirestore("visit_ultra_slot", "Loaded Vegas Ultra Deluxe Slot");
      } catch (e) {
        console.log("Firestore offline mode");
      }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap');

        :root {
            --gold: #ffd700;
            --gold-glow: 0 0 25px rgba(255, 215, 0, 0.9), inset 0 0 10px rgba(255, 215, 0, 0.5);
            --neon-green: #00ff88;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; user-select: none; }
        body { background: #05010a; background-image: radial-gradient(circle at 50% 30%, #4a0e7a 0%, #0d011a 70%, #000 100%); color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: space-between; overflow-x: hidden; position: relative; padding-bottom: 10px; }

        /* HIỆU ỨNG HẠT LẤP LÁNH NỀN */
        #sparkle-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }

        /* HEADER */
        header { width: 100%; background: rgba(10, 2, 20, 0.95); border-bottom: 3px solid var(--gold); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 20px rgba(0,0,0,0.9); z-index: 10; }
        .hdr-balance { background: #000; border: 2px solid var(--gold); border-radius: 20px; padding: 6px 15px; font-size: 14px; font-weight: 900; color: var(--neon-green); box-shadow: var(--gold-glow); }
        .btn-buy-hdr { background: linear-gradient(180deg, #00e676, #00802b); border: 2px solid #fff; color: #fff; font-size: 13px; font-weight: 900; padding: 6px 16px; border-radius: 8px; cursor: pointer; box-shadow: 0 0 10px rgba(0,230,118,0.6); }

        /* SLOT CONTAINER */
        .slot-container { width: 100%; max-width: 800px; padding: 10px; display: flex; flex-direction: column; align-items: center; z-index: 5; }

        .game-title { font-size: 28px; font-weight: 900; background: linear-gradient(180deg, #fff 20%, var(--gold) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 20px rgba(255, 215, 0, 0.8); text-transform: uppercase; margin-bottom: 8px; text-align: center; letter-spacing: 1px; }

        /* JACKPOT 4 TẦNG */
        .jackpot-display-row { display: flex; justify-content: center; gap: 8px; width: 100%; margin-bottom: 15px; flex-wrap: wrap; }
        .jp-box { background: rgba(10, 2, 20, 0.9); border: 2px solid var(--gold); border-radius: 10px; padding: 6px 12px; text-align: center; min-width: 130px; box-shadow: 0 0 10px rgba(255,215,0,0.3); }
        .jp-name { font-size: 10px; font-weight: 900; letter-spacing: 1px; }
        .jp-grand { color: #ff3366; text-shadow: 0 0 8px #ff3366; } 
        .jp-major { color: #cc66ff; text-shadow: 0 0 8px #cc66ff; } 
        .jp-minor { color: #00d2ff; text-shadow: 0 0 8px #00d2ff; } 
        .jp-mini { color: var(--neon-green); text-shadow: 0 0 8px var(--neon-green); }
        .jp-val { font-size: 14px; font-weight: 900; color: var(--gold); }

        /* KHUNG REELS VÀNG LẤP LÁNH */
        .reels-frame { background: linear-gradient(145deg, #18052e, #080112); border: 5px solid var(--gold); border-radius: 20px; padding: 15px; box-shadow: 0 0 45px rgba(255, 215, 0, 0.6), inset 0 0 20px rgba(255, 215, 0, 0.4); display: flex; justify-content: center; gap: 12px; width: 100%; position: relative; overflow: hidden; }
        
        .reel-column { width: 30%; height: 210px; background: #020005; border: 2px solid #5a1b8c; border-radius: 12px; overflow: hidden; position: relative; box-shadow: inset 0 0 15px rgba(0,0,0,0.9); }
        .reel-strip { position: absolute; top: 0; left: 0; width: 100%; display: flex; flex-direction: column; }
        .reel-symbol { height: 70px; display: flex; align-items: center; justify-content: center; font-size: 42px; border-bottom: 1px solid rgba(255,215,0,0.1); filter: drop-shadow(0 4px 6px rgba(0,0,0,0.8)); }

        .win-display { margin-top: 12px; height: 35px; font-size: 20px; font-weight: 900; color: var(--neon-green); text-shadow: 0 0 15px var(--neon-green); text-align: center; }

        /* CONTROL PANEL */
        .control-panel { width: 100%; max-width: 800px; background: linear-gradient(180deg, #240a3d, #0b0114); border: 3px solid var(--gold); border-radius: 18px; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; gap: 10px; box-shadow: 0 8px 25px rgba(0,0,0,0.9), inset 0 0 15px rgba(255,215,0,0.3); z-index: 10; }
        .btn-ctrl { background: linear-gradient(180deg, #424e70, #222a3d); border: 2px solid #aaa; color: #fff; padding: 10px 16px; border-radius: 10px; font-weight: 900; font-size: 14px; cursor: pointer; box-shadow: 0 4px 8px #000; text-transform: uppercase; }
        .btn-ctrl:active { transform: translateY(2px); }
        
        .bet-box { background: #000; border: 2px solid var(--gold); padding: 6px 16px; border-radius: 10px; text-align: center; box-shadow: inset 0 0 8px rgba(255,215,0,0.3); }
        .bet-label { font-size: 9px; color: #aaa; letter-spacing: 1px; }
        .bet-val { font-size: 15px; font-weight: 900; color: var(--gold); }

        .btn-spin { background: linear-gradient(180deg, #00ff88 0%, #008f4c 100%); border: 3px solid #fff; color: #000; padding: 12px 35px; border-radius: 14px; font-size: 22px; font-weight: 900; cursor: pointer; box-shadow: 0 0 25px rgba(0,255,136,0.9); text-transform: uppercase; letter-spacing: 1.5px; }
        .btn-spin:disabled { opacity: 0.6; cursor: not-allowed; }

        .footer-nav { display: flex; gap: 12px; margin-top: 10px; z-index: 10; }
        .btn-gate { padding: 10px 22px; border-radius: 10px; font-weight: 900; border: 2px solid #fff; cursor: pointer; font-size: 13px; text-transform: uppercase; }
    </style>
</head>
<body class="notranslate">

    <!-- CANVAS HIỆU ỨNG HẠT LẤP LÁNH NỀN -->
    <canvas id="sparkle-canvas"></canvas>

    <header>
        <div class="hdr-balance">USDT: <span id="balVal">608,201.00</span></div>
        <button class="btn-buy-hdr" onclick="alert('USDT Gateway Loading...')">BUY USDT</button>
    </header>

    <div class="slot-container">
        <div class="game-title">👑 CLEOPATRA'S FORTUNE DELUXE</div>

        <!-- JACKPOT 4 TẦNG -->
        <div class="jackpot-display-row">
            <div class="jp-box"><div class="jp-name jp-grand">GRAND</div><div class="jp-val" id="jpGrand">$89,333,630</div></div>
            <div class="jp-box"><div class="jp-name jp-major">MAJOR</div><div class="jp-val" id="jpMajor">$46,214,912</div></div>
            <div class="jp-box"><div class="jp-name jp-minor">MINOR</div><div class="jp-val" id="jpMinor">$612,664</div></div>
            <div class="jp-box"><div class="jp-name jp-mini">MINI</div><div class="jp-val" id="jpMini">$46,199</div></div>
        </div>

        <!-- REELS FRAME -->
        <div class="reels-frame">
            <div class="reel-column"><div class="reel-strip" id="reel1"></div></div>
            <div class="reel-column"><div class="reel-strip" id="reel2"></div></div>
            <div class="reel-column"><div class="reel-strip" id="reel3"></div></div>
        </div>

        <div class="win-display" id="winMsg">PRESS SPIN TO WIN!</div>
    </div>

    <!-- CONTROL PANEL -->
    <div class="control-panel">
        <button class="btn-ctrl" onclick="changeBet(-1)">BET -</button>
        <div class="bet-box">
            <div class="bet-label">BET AMOUNT</div>
            <div class="bet-val">$<span id="betAmt">1</span> USDT</div>
        </div>
        <button class="btn-ctrl" onclick="changeBet(1)">BET +</button>
        <button class="btn-ctrl" onclick="setBetMax()">BET MAX</button>
        <button class="btn-spin" id="spinBtn" onclick="spinReels()">SPIN</button>
    </div>

    <div class="footer-nav">
        <button class="btn-gate" style="background: linear-gradient(180deg,#00e676,#00802b); color:#000;" onclick="alert('Deposit USDT')">DEPOSIT</button>
        <button class="btn-gate" style="background: linear-gradient(180deg,#ff1744,#b2102f); color:#fff;" onclick="alert('Withdraw USDT')">WITHDRAW</button>
    </div>

    <script>
        // --- HIỆU ỨNG HẠT LẤP LÁNH BAY LƠ LỬNG ---
        const canvas = document.getElementById('sparkle-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];
        for(let i=0; i<40; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 3 + 1,
                speedY: Math.random() * 0.8 + 0.2,
                opacity: Math.random()
            });
        }

        function animateSparkles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#ffd700";
            particles.forEach(p => {
                ctx.globalAlpha = p.opacity;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                p.y -= p.speedY;
                if(p.y < 0) p.y = canvas.height;
                p.opacity += (Math.random() - 0.5) * 0.05;
                if(p.opacity < 0.1) p.opacity = 0.1;
                if(p.opacity > 1) p.opacity = 1;
            });
            requestAnimationFrame(animateSparkles);
        }
        animateSparkles();

        // --- GAME LOGIC ---
        let balance = 608201.00;
        let currentBet = 1;
        let isSpinning = false;
        const symbols = ['👑', '💎', '⚡', '🪲', '🏺', '7️⃣'];

        function initReel(id) {
            let el = document.getElementById(id);
            let html = '';
            for(let i=0; i<20; i++) {
                let s = symbols[Math.floor(Math.random()*symbols.length)];
                html += `<div class="reel-symbol">${s}</div>`;
            }
            el.innerHTML = html;
            el.style.top = '0px';
        }

        initReel('reel1');
        initReel('reel2');
        initReel('reel3');

        function changeBet(val) {
            if(isSpinning) return;
            currentBet = Math.max(1, currentBet + val);
            document.getElementById('betAmt').innerText = currentBet;
        }

        function setBetMax() {
            if(isSpinning) return;
            currentBet = 100;
            document.getElementById('betAmt').innerText = currentBet;
        }

        function spinReels() {
            if(isSpinning) return;
            if(balance < currentBet) { alert("Low balance!"); return; }

            balance -= currentBet;
            document.getElementById('balVal').innerText = balance.toLocaleString('en-US', {minimumFractionDigits: 2});
            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;
            document.getElementById('winMsg').innerText = "SPINNING...";

            let reels = ['reel1', 'reel2', 'reel3'];
            let results = [];

            reels.forEach((id, index) => {
                let el = document.getElementById(id);
                initReel(id);
                let targetPos = - (Math.floor(Math.random() * 10) + 5) * 70;

                setTimeout(() => {
                    el.style.transition = 'top 0.8s cubic-bezier(0.1, 0.9, 0.2, 1)';
                    el.style.top = targetPos + 'px';
                    
                    let stoppedSymbol = el.children[Math.abs(targetPos/70) + 1].innerText;
                    results.push(stoppedSymbol);

                    if(index === 2) {
                        setTimeout(() => checkWin(results), 800);
                    }
                }, index * 250);
            });
        }

        function checkWin(res) {
            isSpinning = false;
            document.getElementById('spinBtn').disabled = false;

            let win = 0;
            if(res[0] === res[1] && res[1] === res[2]) {
                win = currentBet * 50;
            } else if(res[0] === res[1] || res[1] === res[2] || res[0] === res[2]) {
                win = currentBet * 3;
            }

            if(win > 0) {
                balance += win;
                document.getElementById('balVal').innerText = balance.toLocaleString('en-US', {minimumFractionDigits: 2});
                document.getElementById('winMsg').innerText = `🎉 BIG WIN +$${win} USDT!`;
            } else {
                document.getElementById('winMsg').innerText = "TRY AGAIN!";
            }

            if(window.logVisitorToFirestore) {
                window.logVisitorToFirestore("spin_ultra_slot", `Bet: $${currentBet}, Win: $${win}`);
            }
        }

        setInterval(() => {
            let el = document.getElementById('jpGrand');
            let cur = parseInt(el.innerText.replace(/[\$,]/g, ''));
            cur += Math.floor(Math.random()*25);
            el.innerText = '$' + cur.toLocaleString();
        }, 1000);
    </script>
</body>
</html>
